name: iPad-App bauen

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS-Runner mit Xcode 26 (macos-26, bei Engpass macos-15 oder macos-15-intel)'
        default: macos-26
      testflight:
        description: 'Auch zu TestFlight hochladen (nur auf Anweisung der Leitung; kein Einreichen zur Prüfung)'
        type: boolean
        default: false
      server:
        description: 'Server der Web-App im TestFlight-Build (klassentakt.ch oder z. B. staging.klassentakt.ch)'
        default: klassentakt.ch

jobs:
  ios:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 wählen (App Store verlangt das iOS-26-SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::Kein Xcode 26 auf diesem Runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS-SDK $SDK"
          [ "${SDK%%.*}" -ge 26 ] || { echo "::error::iOS-SDK $SDK, nötig ist 26 oder neuer"; exit 1; }
      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Standard-Server ist klassentakt.ch
        working-directory: ios
        run: |
          grep -qE '^    KT_SERVER: klassentakt\.ch$' project.yml || { echo "::error::project.yml: KT_SERVER muss klassentakt.ch sein"; exit 1; }
      - name: Für den Simulator bauen (ohne Signatur)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Klassentakt.xcodeproj -scheme Klassentakt -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
          ls build/Build/Products/Debug-iphonesimulator/
      - name: iPad-Simulator wählen
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPad' in x['name']]
          c.sort(key=lambda x: ('Pro' not in x['name'], x['name']))
          print(c[0]['udid'])")
          echo "Simulator: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Tests (XCTest)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Klassentakt.xcodeproj -scheme Klassentakt -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -only-testing:KlassentaktTests test 2>&1 | grep -E "Test Case|error:|Executed|TEST (SUCCEEDED|FAILED)|\*\*" | tail -80
      - name: Im iPad-Simulator starten und Screenshots machen
        working-directory: ios
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 || true
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Klassentakt.app
          xcrun simctl launch "$UDID" ch.klassentakt.app
          sleep 25
          mkdir -p shots
          xcrun simctl io "$UDID" screenshot shots/ipad-hochformat.png
          xcrun simctl openurl "$UDID" "https://klassentakt.ch/?classroom=1" || true
          xcrun simctl ui "$UDID" appearance dark || true
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/ipad-dunkel.png
      - uses: actions/upload-artifact@v4
        with:
          name: ipad-screenshots
          path: ios/shots/*.png

  testflight:
    # Signierter Build für TestFlight. Läuft nur, wenn das iPad-Zertifikat als Secret hinterlegt ist.
    needs: ios
    # Von main – oder von Hand mit dem Schalter testflight=true. Ein Push auf einen Arbeits-Branch lädt nie hoch.
    if: github.ref == 'refs/heads/main' || inputs.testflight == true
    runs-on: ${{ inputs.runner || 'macos-26' }}
    env:
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
    steps:
      - name: Zertifikat vorhanden?
        id: chk
        run: if [ -n "$IOS_CERT_P12_BASE64" ]; then echo "ok=ja" >> "$GITHUB_OUTPUT"; else echo "Kein IOS_CERT_P12_BASE64 – TestFlight wird übersprungen"; [ "${{ inputs.testflight }}" != "true" ] || { echo "::error::testflight=true, aber kein Zertifikat"; exit 1; }; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'ja'
      - name: Xcode 26 wählen (App Store verlangt das iOS-26-SDK)
        if: steps.chk.outputs.ok == 'ja'
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::Kein Xcode 26 auf diesem Runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS-SDK $SDK"
          [ "${SDK%%.*}" -ge 26 ] || { echo "::error::iOS-SDK $SDK, nötig ist 26 oder neuer"; exit 1; }
      - name: Zertifikat und Profil installieren
        if: steps.chk.outputs.ok == 'ja'
        env:
          CERT_PW: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/ios.keychain-db"; KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ios.p12"
          security import "$RUNNER_TEMP/ios.p12" -k "$KC" -P "$CERT_PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ios/signing/Klassentakt_App_Store.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/5a177b4d-4a1e-4358-ad4a-2fc34d9bddd5.mobileprovision"
      - name: Archiv bauen (signiert)
        if: steps.chk.outputs.ok == 'ja'
        working-directory: ios
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Klassentakt.xcodeproj -scheme Klassentakt -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Klassentakt.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=Z28KL39TYK CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Klassentakt App Store" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            KT_SERVER="${{ inputs.server || 'klassentakt.ch' }}" \
            archive | tail -30
          GOT=$(/usr/libexec/PlistBuddy -c "Print :KTServer" "$RUNNER_TEMP/Klassentakt.xcarchive/Products/Applications/Klassentakt.app/Info.plist")
          WANT="${{ inputs.server || 'klassentakt.ch' }}"
          SDK=$(/usr/libexec/PlistBuddy -c "Print :DTSDKName" "$RUNNER_TEMP/Klassentakt.xcarchive/Products/Applications/Klassentakt.app/Info.plist")
          echo "Build ${{ github.run_number }} gegen $GOT, SDK $SDK"
          V=$(echo "$SDK" | sed -E 's/^iphoneos([0-9]+).*/\1/'); [ "${V:-0}" -ge 26 ] 2>/dev/null || { echo "::error::Archiv mit $SDK gebaut, App Store verlangt iOS 26"; exit 1; }
          [ "$GOT" = "$WANT" ] || { echo "::error::KTServer im Archiv ist $GOT, erwartet $WANT"; exit 1; }
          # Von main (App Store) nur gegen klassentakt.ch.
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "$GOT" != "klassentakt.ch" ]; then echo "::error::main muss gegen klassentakt.ch bauen"; exit 1; fi
      - name: Zu TestFlight hochladen
        if: steps.chk.outputs.ok == 'ja'
        working-directory: ios
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -o pipefail
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Klassentakt.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" 2>&1 | tee "$RUNNER_TEMP/upload.log" | tail -30
          # Rot, sobald Apple den Upload ablehnt – auch wenn xcodebuild 0 zurückgäbe.
          if grep -qE "Upload failed|EXPORT FAILED|^error:" "$RUNNER_TEMP/upload.log"; then
            echo "::error::Upload zu TestFlight gescheitert (siehe Log)"; exit 1
          fi
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/upload.log" || { echo "::error::Kein EXPORT SUCCEEDED im Log"; exit 1; }
          echo "Build ${{ github.run_number }} zu TestFlight hochgeladen"
