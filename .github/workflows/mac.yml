name: Mac-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Handschrift-Hilfsprogramm kt-ink bauen (Vision)
        run: npm run build:ink
      - name: App bauen
        env:
          # Sobald diese Secrets in GitHub hinterlegt sind, wird mit Developer ID signiert und von Apple geprüft.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            echo "Signiere mit Developer ID und lasse von Apple prüfen (Notarisierung)"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple_api_key.p8"
            npx electron-builder --mac --publish never \
              -c.mac.hardenedRuntime=true -c.mac.notarize=true \
              -c.mac.entitlements=build/entitlements.mac.plist -c.mac.entitlementsInherit=build/entitlements.mac.plist
          else
            echo "Keine Apple-Secrets: ad hoc signiert (nur für Tests)"
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac
          fi
      - name: Signatur und Apple-Prüfung kontrollieren
        run: |
          APP=$(ls -d dist/mac-universal/*.app | head -1)
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime" || true
          INK="$APP/Contents/Resources/kt-ink"
          test -x "$INK" || { echo "::error::kt-ink fehlt im Paket"; exit 1; }
          lipo -info "$INK"
          codesign -v "$INK" || { echo "::error::kt-ink nicht signiert"; exit 1; }
          spctl -a -vvv -t exec "$APP" 2>&1 || true
          DMG=$(ls dist/Klassentakt-*[0-9].dmg | head -1)
          xcrun stapler validate "$APP" || true
      - name: Fester Download-Name (immer neuste Version)
        run: cp dist/Klassentakt-*[0-9].dmg dist/Klassentakt-mac.dmg
      - name: latest.json und dist/download/ erzeugen
        run: node scripts/latest-json.js
      - uses: actions/upload-artifact@v4
        with:
          name: Klassentakt-mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30
      # Für https://klassentakt.ch/download/: entpacken und mit ops/download.sh (Web-Repo) hochladen
      - uses: actions/upload-artifact@v4
        with:
          name: Klassentakt-download
          path: |
            dist/download/Klassentakt-mac.dmg
            dist/download/Klassentakt-mac.zip
            dist/download/latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Version lesen und prüfen, ob es das Release schon gibt
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "neu=nein" >> "$GITHUB_OUTPUT"; else echo "neu=ja" >> "$GITHUB_OUTPUT"; fi
      - name: Release veröffentlichen (nur wenn die Version neu ist)
        if: steps.ver.outputs.neu == 'ja'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Klassentakt ${{ steps.ver.outputs.v }}
          body_path: dist/release-notes.md
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest.json
