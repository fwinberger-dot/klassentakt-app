name: Klassentakt
options:
  bundleIdPrefix: ch.klassentakt
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Klassentakt:
    type: application
    platform: iOS
    sources:
      - path: Klassentakt
    scheme:
      testTargets: [KlassentaktTests, KlassentaktUITests]
    info:
      path: Klassentakt/Info.plist
      properties:
        CFBundleDisplayName: Klassentakt
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Das Werkzeug «Ruhe» im Classroom Screen misst mit dem Mikrofon die Lautstärke im Zimmer. Es wird nichts aufgenommen oder gespeichert.
        NSPhotoLibraryAddUsageDescription: Klassentakt sichert Scans und Fotos der Dokumentenkamera in deinen Fotos, wenn du das im Teilen-Menü wählst.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Bild
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          - CFBundleTypeName: Kalender
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.ical.ics]
          - CFBundleTypeName: Klassentakt-Paket
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [ch.klassentakt.paket]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ch.klassentakt.paket
            UTTypeDescription: Klassentakt-Paket
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [klassentakt]
              public.mime-type: [application/x-klassentakt]
        NSCameraUsageDescription: Klassentakt braucht die Kamera, um Arbeitsblätter und Tafelbilder zu scannen und als Dokumentenkamera auf dem Beamer zu zeigen. Die Bilder bleiben auf dem iPad, bis du sie in eine Lektion übernimmst.
        CFBundleURLTypes:
          - CFBundleURLName: ch.klassentakt.app
            CFBundleURLSchemes: [klassentakt]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: Beamer
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).BeamerSceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.klassentakt.app
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  KlassentaktTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KlassentaktTests
    dependencies:
      - target: Klassentakt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.klassentakt.app.tests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  KlassentaktUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KlassentaktUITests
    dependencies:
      - target: Klassentakt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.klassentakt.app.uitests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
