name: Klassentakt
options:
  bundleIdPrefix: ch.klassentakt
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Klassentakt:
    type: application
    platform: iOS
    sources:
      - path: Klassentakt
    info:
      path: Klassentakt/Info.plist
      properties:
        CFBundleDisplayName: Klassentakt
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Klassentakt braucht das Mikrofon für den Ruhe-Timer.
        NSCameraUsageDescription: Klassentakt braucht die Kamera für die Dokumentenkamera.
        CFBundleURLTypes:
          - CFBundleURLName: ch.klassentakt.app
            CFBundleURLSchemes: [klassentakt]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: Beamer
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).BeamerSceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.klassentakt.app
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Klassentakt/Klassentakt.entitlements
        GENERATE_INFOPLIST_FILE: NO
